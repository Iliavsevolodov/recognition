<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffd21c" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Recognition — админка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div></div>
  <main class="admin-shell">
    <section id="adminLogin" class="login-view">
      <form id="loginForm" class="login-card">
        <div class="eyebrow">RECOGNITION ADMIN</div>
        <h1>Сценическое<br><span>признание</span></h1>
        <p>Списки участников, квалификации и количество грамот.</p>
        <label><span>Пароль</span><input id="adminPassword" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" enterkeyhint="done" autocomplete="current-password" required placeholder="Введите пароль" /></label>
        <button id="loginButton" class="primary-button" type="submit">Войти</button>
      </form>
    </section>

    <section id="adminApp" class="hidden">
      <header class="admin-header">
        <div><div class="eyebrow">BUSINESS SESSION · RECOGNITION</div><h1>Признание</h1></div>
        <button id="logoutButton" class="icon-button" type="button" title="Выйти">↗</button>
      </header>

      <section class="stats-grid">
        <article class="stat-card dark"><span>Всего заявок</span><strong id="totalCount">0</strong></article>
        <article class="stat-card yellow"><span>500 PV</span><strong id="pvCount">0</strong></article>
        <article class="stat-card cream"><span>Квалификаций</span><strong id="qualCount">0</strong></article>
      </section>

      <section class="panel certificate-panel">
        <div class="panel-head"><div><span class="section-kicker">Печать</span><h2>Сколько грамот</h2></div><button id="copyStats" class="secondary-button" type="button">Скопировать</button></div>
        <div id="qualificationStats" class="qualification-stats"></div>
      </section>

      <section class="panel list-panel">
        <div class="panel-head"><div><span class="section-kicker">Заявки</span><h2>Полный список</h2></div><div class="head-actions"><button id="copyList" class="secondary-button" type="button">Копировать</button><button id="exportCsv" class="secondary-button" type="button">CSV</button></div></div>
        <div class="filter-grid">
          <input id="searchInput" placeholder="Поиск по ФИО или ID" />
          <select id="typeFilter"><option value="all">Все достижения</option><option value="pv500">500 PV</option><option value="qualification">Квалификации</option></select>
          <select id="qualificationFilter"><option value="all">Все квалификации</option><option>S1</option><option>S2</option><option>L</option><option>L1 PRO</option><option>L2</option><option>L2 PRO</option><option>L3</option><option>L3 PRO</option></select>
        </div>
        <div class="list-meta"><span id="filteredCount">0 записей</span></div>
        <div id="submissionsList" class="submissions-list"></div>
      </section>
    </section>
  </main>

  <div id="editModal" class="modal-backdrop" aria-hidden="true">
    <div class="edit-card">
      <button id="editClose" class="modal-close" type="button">×</button>
      <span class="section-kicker">Заявка</span><h2>Редактировать</h2>
      <form id="editForm" class="stack-form">
        <div class="form-grid"><label><span>Фамилия</span><input id="editLastName" required /></label><label><span>Имя</span><input id="editFirstName" required /></label></div>
        <label><span>ID</span><input id="editPartnerId" required /></label>
        <label><span>Тип</span><select id="editType"><option value="pv500">500 PV</option><option value="qualification">Квалификация</option></select></label>
        <label id="editQualificationWrap"><span>Квалификация</span><select id="editQualification"><option>S1</option><option>S2</option><option>L</option><option>L1 PRO</option><option>L2</option><option>L2 PRO</option><option>L3</option><option>L3 PRO</option></select></label>
        <button class="primary-button" type="submit">Сохранить</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=1"></script>
  <script src="./admin.js?v=2"></script>
</body>
</html>
